name: Standalone Artifacts

# RLY-owned primary distribution (#35 + #128): builds the standalone runtime
# artifact matrix from a clean compiled tree, bundles the pinned Node runtime,
# enforces the positive allowlist + absence checks, runs the `rly --version`
# smoke on matching CI hosts, QUALIFIES the exact artifact bytes (exact-byte
# qualification is the publication authority), and publishes the SIGNED release
# supply chain (canonical release manifest, per-artifact SBOM + provenance,
# Ed25519 signatures, signed channel metadata).
#
# Topology (one reusable job, two runners):
#   - linux-x64 on ubuntu-latest builds/qualifies/signs linux-x64 as today
#     for Stable and is the only job that publishes/uploads/attaches Stable
#     assets. Beta/manual may still build experimental targets here.
#   - linux-arm64 on ubuntu-24.04-arm builds ONLY linux-arm64, verifies the
#     unpacked tarball, and runs exact-byte qualification on a matching
#     runner. It never publishes Stable assets and does not enable lingering.
#   darwin-arm64 and darwin-x64 remain experimental (no qualified macOS
#   runner). linux-arm64 stays experimental for Stable publication until
#   systemd user-manager qualification is accepted.
#
# Triggered by a GitHub Release publication (the canonical artifact lineage:
# the release tag IS the version input, so package.json/tag/runtime identity
# never diverge) or manually with an explicit release-version input.
#
# Supply-chain controls (#128):
#   - release-critical third-party Actions are pinned to reviewed immutable
#     commit SHAs (see scripts/check-release-supply-chain.mjs),
#   - `contents: write` is the least privilege required to upload/attach
#     release assets; nothing else is granted,
#   - the signing PRIVATE key is referenced ONLY via the repository secret
#     RLY_RELEASE_SIGNING_KEY (never inline); the PUBLIC key is committed at
#     scripts/release/signing-public-key.pem,
#   - npm credentials are never configured (npm is not the primary channel).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-version:
        description: "Canonical release version (e.g. 1.0.0-beta.32); defaults to the release tag or package.json version"
        required: false
        type: string
      targets:
        description: "Comma-separated targets; empty = linux-x64 for Stable, all experimental targets for Beta"
        required: false
        type: string
      channel:
        description: "Release channel (beta|stable); derived from the release tag when empty"
        required: false
        type: string

permissions:
  contents: write

jobs:
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-latest
            publish: "true"
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            publish: "false"
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release && github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve canonical release version and channel
        id: version
        env:
          RLY_RELEASE_VERSION: ${{ inputs.release-version || '' }}
          RELEASE_TAG: ${{ github.event.release && github.event.release.tag_name || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || '' }}
        run: |
          VERSION="${RLY_RELEASE_VERSION:-${RELEASE_TAG#v}}"
          CHANNEL="${INPUT_CHANNEL:-}"
          if [ -z "${CHANNEL}" ]; then
            case "${VERSION}" in
              *-beta.*) CHANNEL="beta" ;;
              *) CHANNEL="stable" ;;
            esac
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Canonical release version: ${VERSION} (channel ${CHANNEL})"
      - name: Build standalone artifact matrix
        env:
          RLY_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RLY_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          INPUT_TARGETS: ${{ inputs.targets || '' }}
          JOB_ID: ${{ matrix.id }}
          PUBLISH: ${{ matrix.publish }}
        run: |
          TARGETS="${INPUT_TARGETS:-}"
          if [ "${JOB_ID}" = "linux-arm64" ]; then
            TARGETS="linux-arm64"
          elif [ -z "${TARGETS}" ]; then
            if [ "${RLY_RELEASE_CHANNEL}" = "stable" ]; then
              TARGETS="linux-x64"
            else
              TARGETS="all"
            fi
          fi
          if [ "${PUBLISH}" = "true" ] && [ "${RLY_RELEASE_CHANNEL}" = "stable" ] && [ "${TARGETS}" != "linux-x64" ]; then
            echo "Stable publication on ubuntu-latest is restricted to the qualified linux-x64 target; requested: ${TARGETS}" >&2
            exit 1
          fi
          ARGS=(--build --targets "${TARGETS}")
          node scripts/standalone/build-standalone.mjs "${ARGS[@]}"
      - name: Verify artifact matrix (allowlist, identity, digest, smoke from unpacked tarball)
        env:
          RLY_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RLY_RELEASE_VERSION}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          for tarball in out/standalone/rly-${VERSION}-*.tar.gz; do
            target_dir="$(basename "$tarball" .tar.gz)"
            mkdir -p "$TMP/$target_dir"
            tar -xzf "$tarball" -C "$TMP/$target_dir"
            node scripts/standalone/verify-artifact.mjs --artifact "$TMP/$target_dir" --expected-version "${VERSION}" --smoke
          done
      - name: Sign exact artifact bytes before qualification
        if: ${{ matrix.publish == 'true' }}
        env:
          RLY_RELEASE_SIGNING_KEY: ${{ secrets.RLY_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/release/sign-artifacts.mjs \
            --release-dir out/standalone \
            --signing-key env:RLY_RELEASE_SIGNING_KEY
      - name: Provision the user service manager for Stable qualification
        if: ${{ matrix.publish == 'true' && steps.version.outputs.channel == 'stable' }}
        run: |
          set -euo pipefail
          USER_ID="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${USER_ID}.service"
          mkdir -p "$HOME/.config/systemd/user"
          echo "XDG_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/run/user/${USER_ID}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${USER_ID}/bus" >> "$GITHUB_ENV"
          echo "RLY_QUALIFICATION_USE_HOST_SERVICE_MANAGER=1" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/${USER_ID}" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${USER_ID}/bus" \
            systemctl --user show-environment >/dev/null
      - name: Qualify exact artifact bytes (supported CI target)
        env:
          RLY_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RLY_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          VERSION="${RLY_RELEASE_VERSION}"
          CHANNEL="${RLY_RELEASE_CHANNEL}"
          # Qualify every target from the EXACT unpacked bytes. Host-aware gates
          # (clean-install/identity) skip targets the runner cannot execute and
          # record the gap; a FAILED gate (not-qualified) fails the workflow.
          for tarball in out/standalone/rly-${VERSION}-*.tar.gz; do
            target_dir="$(basename "$tarball" .tar.gz)"
            target="${target_dir#rly-${VERSION}-}"
            node scripts/release/qualify.mjs --release-dir out/standalone --target "${target}" --version "${VERSION}" --channel "${CHANNEL}"
          done
      - name: Clean up the qualification service manager state
        if: ${{ always() && matrix.publish == 'true' && steps.version.outputs.channel == 'stable' }}
        run: |
          systemctl --user disable --now rly-gateway.service || true
          rm -f "$HOME/.config/systemd/user/rly-gateway.service"
          systemctl --user daemon-reload || true
          sudo loginctl disable-linger "$USER" || true
      - name: Publish signed release supply chain (manifest, SBOM, provenance, signatures, channel metadata)
        if: ${{ matrix.publish == 'true' }}
        env:
          RLY_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RLY_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          RLY_RELEASE_SIGNING_KEY: ${{ secrets.RLY_RELEASE_SIGNING_KEY }}
        run: |
          node scripts/release/publish.mjs \
            --release-dir out/standalone \
            --version "${RLY_RELEASE_VERSION}" \
            --channel "${RLY_RELEASE_CHANNEL}" \
            --signing-key env:RLY_RELEASE_SIGNING_KEY \
            --workflow-name standalone-artifacts \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-sha "${{ github.sha }}" \
            --toolchain-node 24 \
            --toolchain-pnpm 11.16.0 \
            --toolchain-os ubuntu-latest \
            --qualification out/standalone/rly-qualification.json \
            --verbose
      - name: Verify signed release supply chain
        if: ${{ matrix.publish == 'true' }}
        env:
          RLY_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RLY_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          node scripts/release/verify-release.mjs \
            --release-dir out/standalone \
            --channel "${RLY_RELEASE_CHANNEL}" \
            --verbose
      - name: Upload artifact matrix + release supply chain
        if: ${{ matrix.publish == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rly-standalone-${{ steps.version.outputs.version }}
          path: out/standalone/**
          if-no-files-found: error
      - name: Attach artifacts to the GitHub Release
        if: ${{ matrix.publish == 'true' && github.event_name == 'release' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" scripts/install.sh out/standalone/*.tar.gz out/standalone/*.sha256 out/standalone/*.tar.gz.sig out/standalone/*.sbom.json out/standalone/rly-release.json out/standalone/rly-release.json.sig out/standalone/rly-provenance.json out/standalone/rly-provenance.json.sig out/standalone/rly-channel-*.json out/standalone/rly-channel-*.json.sig out/standalone/rly-qualification.json out/standalone/artifacts.json --clobber
